name: Deploy to Staging

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      NITRO_PRESET: vercel
      VERCEL: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel and Assign Alias
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

          vercel alias set "$DEPLOY_URL" "${{ secrets.VERCEL_ALIAS_STAGING }}" --token=${{ secrets.VERCEL_TOKEN }}
          
          # https:// プレフィックスを考慮してエイリアスURLを出力
          ALIAS="${{ secrets.VERCEL_ALIAS_STAGING }}"
          if [[ ! "$ALIAS" =~ ^https?:// ]]; then
            ALIAS="https://$ALIAS"
          fi
          echo "alias_url=$ALIAS" >> "$GITHUB_OUTPUT"

      - name: Comment or Update PR
        uses: marocchino/sticky-pull-request-comment@v2
        # デプロイ成否に関わらず実行しつつ、手動実行(workflow_dispatch)時はPRが存在しないためスキップ
        if: always() && github.event_name == 'pull_request'
        with:
          header: staging-deploy-status
          message: |
            ## 🚀 Staging Deployment Result

            | Parameter | Status / Value |
            | :--- | :--- |
            | **Status** | ${{ steps.deploy.outcome == 'success' && '✅ Succeeded' || '❌ Failed' }} |
            | **Fixed URL (Alias)** | ${{ steps.deploy.outputs.alias_url && format('[{0}]({0})', steps.deploy.outputs.alias_url) || 'N/A' }} |
            | **Preview URL (Hash)** | ${{ steps.deploy.outputs.deploy_url && format('[{0}]({0})', steps.deploy.outputs.deploy_url) || 'N/A' }} |
            | **Commit Hash** | `${{ github.event.pull_request.head.sha }}` |
            | **Branch** | `${{ github.head_ref }}` |

            ---
            *Updated at: ${{ github.event.repository.updated_at }}*
            

  e2e:
    name: Run Staging E2E
    needs: deploy
    uses: ./.github/workflows/e2e-staging.yml
    secrets: inherit
