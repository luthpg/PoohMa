name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest

    # ジョブ全体でダミー環境変数を共有（BuildだけでなくTest時にも参照可能にする）
    env:
      VITE_FIREBASE_API_KEY: "dummy_key"
      VITE_FIREBASE_AUTH_DOMAIN: "dummy.firebaseapp.com"
      VITE_FIREBASE_PROJECT_ID: "dummy"
      VITE_FIREBASE_STORAGE_BUCKET: "dummy.appspot.com"
      VITE_CONVEX_URL: "https://dummy.convex.cloud"
      VITE_CONVEX_SITE_URL: "https://dummy.convex.site"
      VITE_GOOGLE_PICKER_API_KEY: "dummy"
      VITE_GOOGLE_CLOUD_PROJECT_NUMBER: "dummy"
      MICROCMS_SERVICE_DOMAIN: "dummy"
      MICROCMS_API_KEY: "dummy"
      CONVEX_INTERNAL_SECRET: "dummy"
      ABSTRACT_IP_GEOLOCATION_API_KEY: "dummy"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 1. Playwright のブラウザキャッシュ（CI高速化）
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      # 2. Chromium と Linux 依存ライブラリのインストール
      - name: Install Playwright Chromium with dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @poohma/web exec playwright install chromium --with-deps

      # キャッシュヒット時でも Linux 依存ライブラリのチェックを行う
      - name: Install Playwright OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @poohma/web exec playwright install-deps chromium

      - name: Lint & Format Check (Biome)
        run: pnpm run check:ci

      - name: Type Check
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Run Tests (Vitest)
        run: pnpm run test

  convex-dry-run:
    name: Convex Deploy Dry Run
    runs-on: ubuntu-latest
    # forkや外部PRはスキップ（リポジトリオーナーで判定）
    if: ${{ github.repository_owner == github.event.repository.owner.login && !github.event.pull_request.head.repo.fork }}
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Convex Deploy Dry Run
        working-directory: apps/web
        run: pnpm exec convex deploy --dry-run
